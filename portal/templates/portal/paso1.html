{% extends "base_publico.html" %}
{% block titulo %}Reserva tu hora{% endblock %}
{% block cuerpo %}
{% include "portal/_pasos.html" with paso=1 %}
<h1 class="titulo-pagina">Reserva tu hora</h1>

<form method="get" action="{% url 'portal:horas' %}" class="tarjeta tarjeta-cuerpo">
  <div class="row g-3 align-items-end">
    <div class="col-md-5">
      <label class="form-label" for="esp">Especialidad <span class="req">*</span></label>
      <select class="form-select" name="esp" id="esp" required>
        <option value="">Selecciona…</option>
        {% for x in especialidades %}<option value="{{ x.e.pk }}" data-pols="{{ x.pols }}" {% if esp_sel == x.e.pk|stringformat:"s" %}selected{% endif %}>{{ x.e.nombre }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-5">
      <label class="form-label" for="pol">Policlínico <span class="req">*</span></label>
      <select class="form-select" name="pol" id="pol" required>
        <option value="">Primero elige la especialidad</option>
        {% for p in policlinicos %}<option value="{{ p.pk }}" {% if pol_sel == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.nombre }}</option>{% endfor %}
      </select>

    </div>
    <div class="col-md-2"><button class="btn btn-primary btn-lg-hd w-100">Buscar horas</button></div>
  </div>
</form>
<a class="btn btn-gris btn-lg-hd mt-3" href="/">Volver al inicio</a>
{% endblock %}
{% block scripts %}
<script>
const esp = document.getElementById("esp"), pol = document.getElementById("pol");
function filtrar() {
  const opt = esp.selectedOptions[0], permitidos = opt && opt.dataset.pols ? opt.dataset.pols.split(",") : [];
  [...pol.options].forEach(o => { if (o.value) o.hidden = !permitidos.includes(o.value); });
  pol.disabled = !esp.value;
  pol.options[0].textContent = esp.value ? "Selecciona…" : "Primero elige la especialidad";
  if (pol.selectedOptions[0] && pol.selectedOptions[0].hidden) pol.value = "";
  if (permitidos.length === 1) pol.value = permitidos[0];
}
esp.addEventListener("change", filtrar); filtrar();
</script>
{% endblock %}
