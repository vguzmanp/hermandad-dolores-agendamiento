{% extends "base_publico.html" %}
{% block titulo %}Lista de espera{% endblock %}
{% block cuerpo %}
<div class="tarjeta tarjeta-cuerpo">
  <div class="d-flex align-items-center gap-3 mb-3">
    <div class="icono-ok">{% include "includes/icono.html" with n="check" t=26 %}</div>
    <div><h1 class="titulo-pagina mb-0">Quedaste en la lista de espera</h1>
      {% if especialidad %}<div class="text-gris">{{ especialidad }}</div>{% endif %}</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-primary btn-lg-hd" href="{% url 'portal:inicio' %}">Reservar otra hora</a>
    <a class="btn btn-gris btn-lg-hd" href="/">Volver al inicio</a>
  </div>
</div>
{% endblock %}
