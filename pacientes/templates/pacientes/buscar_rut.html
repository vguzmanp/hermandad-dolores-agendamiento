{% extends "base.html" %}
{% block titulo %}Buscar paciente{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Buscar paciente por RUT</h1>
        <p class="text-muted small">Antes de registrar, el sistema verifica si el paciente ya existe (RF-02).</p>
        <form method="get">
          {% include "includes/campo.html" with campo=form.rut %}
          <button class="btn btn-hd">Buscar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
