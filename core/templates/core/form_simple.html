{% extends "base.html" %}
{% block titulo %}{{ titulo|capfirst }}{% endblock %}
{% block contenido %}
<div style="max-width: 760px">
  <h1 class="titulo-pagina mb-3">{{ titulo|capfirst }}</h1>
  <div class="tarjeta tarjeta-cuerpo">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_generico.html" %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-lg-hd">Guardar</button>
        <a class="btn btn-gris btn-lg-hd" href="{% url url_volver %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
